<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>TITAN ATHLETICS | Unleash Your Power</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --blue: #48b9ff;
      --navy: #07111e;
      --panel: #0d1b2a;
      --white: #f4f8fc;
      --muted: #8c9caf;
      --border: #24384d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: Inter, sans-serif;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .container {
      width: min(1160px, 90%);
      margin: auto;
    }

    h1, h2, h3, .logo {
      font-family: "Barlow Condensed", sans-serif;
      text-transform: uppercase;
    }

    /* NAVIGATION */
    .navbar {
      height: 78px;
      padding: 0 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(7,17,30,.94);
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span { color: var(--blue); }

    .nav-links {
      display: flex;
      gap: 27px;
      align-items: center;
    }

    .nav-links a {
      font-size: 11px;
      color: #bac6d5;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color .2s;
    }

    .nav-links a:hover { color: var(--blue); }

    .nav-btn, .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 14px 23px;
      background: var(--blue);
      color: #04111d;
      border: 0;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: .25s;
    }

    .nav-btn:hover, .btn:hover {
      background: white;
      transform: translateY(-3px);
    }

    .menu-btn {
      display: none;
      border: 0;
      color: white;
      background: none;
      font-size: 27px;
    }

    /* HERO */
    .hero {
      min-height: 760px;
      height: 100svh;
      max-height: 950px;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 80% 45%, #123d61 0%, transparent 38%),
        linear-gradient(115deg, #07111e 25%, #0a1b2d 100%);
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(72,185,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72,185,255,.07) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(90deg, transparent, black);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      padding-top: 70px;
      width: 100%;
    }

    .tag {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      color: var(--blue);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .tag::before {
      content: "";
      width: 27px;
      height: 2px;
      background: var(--blue);
    }

    .hero h1 {
      font-size: clamp(70px, 11vw, 145px);
      line-height: .78;
      letter-spacing: -3px;
      font-weight: 900;
      max-width: 750px;
    }

    .hero h1 span {
      color: var(--blue);
      display: block;
    }

    .hero-description {
      max-width: 420px;
      color: #a7b7c9;
      font-size: 13px;
      line-height: 1.9;
      margin-top: 32px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 29px;
    }

    .outline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #52657a;
      padding: 14px 23px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: .25s;
    }

    .outline-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .hero-stats {
      display: flex;
      gap: 45px;
      margin-top: 55px;
    }

    .stat strong {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 32px;
      display: block;
    }

    .stat span {
      display: block;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    /* ANIMATED ENERGY CORE */
    .energy-scene {
      position: absolute;
      right: 5%;
      top: 19%;
      width: 440px;
      height: 440px;
      display: grid;
      place-items: center;
      perspective: 800px;
      pointer-events: none;
    }

    .energy-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 1px solid rgba(72,185,255,.45);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(72,185,255,.08);
      animation: spin 14s linear infinite;
    }

    .energy-ring.r2 {
      width: 78%;
      height: 115%;
      border-color: rgba(72,185,255,.7);
      animation: spin3d 9s linear infinite;
    }

    .energy-ring.r3 {
      width: 115%;
      height: 70%;
      border-color: rgba(142,102,255,.65);
      animation: spin3d 12s linear infinite reverse;
    }

    .energy-ring.r4 {
      width: 65%;
      height: 65%;
      border-style: dashed;
      border-color: rgba(255,255,255,.35);
      animation-duration: 22s;
    }

    .energy-core {
      width: 145px;
      height: 145px;
      background: linear-gradient(140deg, #c9f2ff, #48b9ff 35%, #1160a1 75%, #07111e);
      clip-path: polygon(50% 0, 92% 22%, 100% 68%, 65% 100%, 15% 85%, 0 38%);
      filter: drop-shadow(0 0 35px rgba(72,185,255,.7));
      animation: corePulse 4s ease-in-out infinite;
    }

    .core-label {
      position: absolute;
      right: 0;
      bottom: 20px;
      background: rgba(10,25,41,.85);
      border: 1px solid #2c5778;
      padding: 17px 20px;
      backdrop-filter: blur(12px);
    }

    .core-label span {
      color: var(--blue);
      font-size: 9px;
      letter-spacing: 2px;
    }

    .core-label strong {
      display: block;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 22px;
      margin-top: 5px;
    }

    /* TICKER */
    .ticker {
      overflow: hidden;
      background: var(--blue);
      color: #07111e;
      padding: 17px 0;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: ticker 24s linear infinite;
    }

    .ticker-track span {
      padding: 0 28px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .ticker-track span::after {
      content: "✳";
      margin-left: 45px;
    }

    /* SHARED SECTIONS */
    section { padding: 100px 0; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 25px;
      margin-bottom: 45px;
    }

    .section-kicker {
      color: var(--blue);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 13px;
      text-transform: uppercase;
    }
